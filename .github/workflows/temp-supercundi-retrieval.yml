name: Temporary Supercundi retrieval

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[TEMP-SUPERCUNDI-54879]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect Baranda and capture network
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output/assets
          curl -k -L --retry 3 --connect-timeout 20 --max-time 120 \
            'https://servicios.supersociedades.gov.co/barandaVirtual/' \
            -D output/root-headers.txt -o output/root.html || true
          curl -k -L --retry 3 --connect-timeout 20 --max-time 120 \
            'https://www.supersociedades.gov.co/documents/58444/159253/2020-01-278501.pdf' \
            -D output/guess-headers.txt -o output/guess.bin || true
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re, requests
          out=Path('output'); html=(out/'root.html').read_text(errors='ignore')
          base='https://servicios.supersociedades.gov.co/barandaVirtual/'
          urls=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I): urls.append(urljoin(base,src))
          urls=list(dict.fromkeys(urls)); (out/'asset-urls.txt').write_text('\n'.join(urls))
          s=requests.Session(); s.verify=False
          for i,u in enumerate(urls):
              try: (out/'assets'/f'{i:03d}.js').write_bytes(s.get(u,timeout=120).content)
              except Exception as e: (out/'asset-errors.txt').open('a').write(f'{u}: {e}\n')
          with (out/'snippets.txt').open('w') as f:
              for p in (out/'assets').glob('*'):
                  t=p.read_text(errors='ignore')
                  for m in re.finditer(r'.{0,200}(?:radicaci|expediente|documento|descarg|api|service).{0,400}',t,re.I): f.write(f'\n---{p.name}---\n{m.group(0)}\n')
          PY
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > capture.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({acceptDownloads:true,ignoreHTTPSErrors:true});
          const page=await context.newPage(); const traffic=[];
          page.on('request',r=>traffic.push({kind:'request',method:r.method(),url:r.url(),postData:r.postData()}));
          page.on('response',async r=>traffic.push({kind:'response',status:r.status(),url:r.url(),headers:await r.allHeaders().catch(()=>({}))}));
          page.on('console',m=>traffic.push({kind:'console',type:m.type(),text:m.text()}));
          await page.goto('https://servicios.supersociedades.gov.co/barandaVirtual/#!/app/radicaciones',{waitUntil:'networkidle',timeout:120000}).catch(e=>traffic.push({kind:'error',text:String(e)}));
          await page.waitForTimeout(10000);
          fs.writeFileSync('output/page.html',await page.content()); fs.writeFileSync('output/text.txt',await page.locator('body').innerText().catch(()=>'')); fs.writeFileSync('output/traffic.json',JSON.stringify(traffic,null,2));
          await page.screenshot({path:'output/page.png',fullPage:true}); await browser.close();
          JS
          node capture.mjs || true
          file output/* > output/file-types.txt || true

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: supercundi-diagnostic
          path: output
          retention-days: 1
